<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIE TOMORROW 明日再死</title>
<style>
:root{--hud:#e8eef2;--dim:rgba(232,238,242,.55);--acc:#ffb347;--red:#ff4a3d}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--hud);font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
#gl,#hudc{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#hudc{pointer-events:none}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.65);opacity:0;transition:opacity .8s}
#hud.on{opacity:1}
.num,#mag,#res{font-family:"DIN Alternate","Bahnschrift","DIN Condensed","Arial Narrow",sans-serif}
#obj{position:absolute;left:30px;top:26px;font-size:12px;letter-spacing:.12em}
#obj .lbl{color:var(--dim);font-size:10px;letter-spacing:.3em;margin-bottom:5px}
#objT{font-size:14px;font-weight:600;letter-spacing:.1em}
#objT::before{content:"";display:inline-block;width:7px;height:7px;border:1.5px solid var(--acc);transform:rotate(45deg);margin-right:10px;vertical-align:1px}
#objS{color:var(--dim);margin:4px 0 0 20px;font-size:11px;letter-spacing:.2em}
#ammo{position:absolute;right:36px;bottom:30px;text-align:right;min-width:150px}
#ammo .row{display:flex;align-items:baseline;justify-content:flex-end;gap:8px}
#mag{font-size:54px;line-height:1;font-weight:600}
#mag.low{color:var(--red)}
#res{font-size:19px;color:var(--dim)}
#wname{font-size:10px;letter-spacing:.24em;color:var(--dim);margin-top:7px;border-top:1px solid rgba(255,255,255,.28);padding-top:6px}
#hpw{position:absolute;left:30px;bottom:32px;width:230px}
#hpw .lbl{font-size:10px;letter-spacing:.3em;color:var(--dim);margin-bottom:7px}
#hpw .bar{height:4px;background:rgba(255,255,255,.16)}
#hpb{display:block;height:100%;width:100%;background:var(--hud);transition:width .2s,background .3s}
#prompt{position:absolute;left:50%;top:63%;transform:translateX(-50%);font-size:14px;letter-spacing:.12em;opacity:0;transition:opacity .2s;background:rgba(0,0,0,.4);padding:7px 16px;border-left:2px solid var(--acc);white-space:nowrap}
#prompt kbd{border:1px solid var(--hud);padding:0 7px;margin-right:8px;font-family:inherit}
#feed{position:absolute;left:50%;top:57%;transform:translateX(-50%);text-align:center;font-size:13px;letter-spacing:.18em;color:var(--acc);font-weight:600}
#feed div{animation:fd 1.5s forwards}
@keyframes fd{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#radio{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);max-width:62%;text-align:center;font-size:15px;line-height:1.6;opacity:0;transition:opacity .35s;background:rgba(0,0,0,.4);padding:7px 18px}
#radio .who{color:var(--acc);margin-right:10px;font-weight:700;letter-spacing:.1em}
#banner{position:absolute;left:50%;top:28%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .6s;white-space:nowrap}
#banner .t{font-size:30px;letter-spacing:.4em;font-weight:700}
#banner .s{font-size:13px;letter-spacing:.3em;color:var(--dim);margin-top:10px}
#fps{position:absolute;right:10px;top:8px;font-size:10px;color:var(--dim)}
#overlay{position:fixed;inset:0;display:flex;align-items:center;background:linear-gradient(90deg,rgba(0,0,0,.88),rgba(0,0,0,.45) 55%,rgba(0,0,0,.12));cursor:pointer;z-index:5}
#overlay .box{margin-left:8vw;max-width:540px}
#overlay .op{font-size:12px;letter-spacing:.3em;color:var(--dim);margin-top:26px}
#overlay .op b{color:#fff;font-weight:600;letter-spacing:.2em;margin-left:8px}
#overlay h1{margin:0;font-size:66px;letter-spacing:.16em;font-weight:800;line-height:1;color:#fff}
#overlay h1 small{display:block;font-size:14px;letter-spacing:.6em;color:var(--acc);font-weight:600;margin-top:14px}
#overlay p{color:#c8d0d6;line-height:1.8;font-size:14px;margin:10px 0}
#overlay .brief{border-left:2px solid var(--acc);padding-left:16px;margin:28px 0}
#overlay .keys{font-size:12px;color:var(--dim);line-height:2.1}
#overlay kbd{border:1px solid rgba(255,255,255,.5);padding:0 6px;margin:0 2px;color:#fff;font-family:inherit;font-size:11px}
#overlay .go{margin-top:28px;font-size:15px;letter-spacing:.4em;color:#fff;animation:bl 1.6s infinite}
#overlay .bar{width:340px;height:3px;background:rgba(255,255,255,.15);margin-top:26px}
#overlay .bar b{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
#overlay .stat{font-size:15px;line-height:2.1;color:#fff;margin-top:20px}
#overlay .stat b{color:var(--acc);font-weight:600}
@keyframes bl{50%{opacity:.35}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hudc"></canvas>
<div id="hud">
  <div id="obj"><div class="lbl">OBJECTIVE · 当前目标</div><div id="objT">切断三座上行中继站</div><div id="objS">中继站 0 / 3</div></div>
  <div id="hpw"><div class="lbl">HEALTH</div><div class="bar"><b id="hpb"></b></div></div>
  <div id="ammo"><div class="row"><span id="mag">30</span><span id="res">/ 150</span></div><div id="wname">MK-7 卡宾枪 · 全自动</div></div>
  <div id="prompt"></div>
  <div id="feed"></div>
  <div id="radio"><span class="who"></span><span class="txt"></span></div>
  <div id="banner"><div class="t"></div><div class="s"></div></div>
  <div id="fps"></div>
</div>
<div id="overlay"><div class="box" id="obox">
  <h1>DIE<br>TOMORROW<small>明日再死</small></h1>
  <p id="ldt">正在生成世界…</p><div class="bar"><b id="ldb"></b></div>
</div></div>
